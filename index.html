<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capi-Aprende — Protótipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;700;800&family=Manrope:wght@400;600;700&display=swap">
<style>
  :root{color-scheme:light;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#0B0F09;color:#F4F7EE;font-family:'Manrope',sans-serif;padding:24px;}
  .wrap{max-width:520px;text-align:center;}
  .logo{width:96px;height:96px;margin:0 auto 18px;border-radius:22px;background:#141B10;
    display:flex;align-items:center;justify-content:center;padding:10px;}
  .logo img{width:100%;height:100%;object-fit:contain;}
  h1{font-family:'Sora',sans-serif;font-weight:800;font-size:26px;margin:0 0 8px;}
  p{color:#93A187;font-size:14px;line-height:1.6;margin:0 0 26px;}
  .links{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
  a.btn{font-family:'Manrope',sans-serif;font-weight:700;font-size:14px;text-decoration:none;
    padding:13px 22px;border-radius:12px;display:inline-block;}
  a.primary{background:#57FF2E;color:#06280A;}
  a.ghost{background:transparent;border:1.5px solid #232E1C;color:#F4F7EE;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo"><img src="assets/img/logo_140.png" alt="Capi-Aprende"></div>
    <h1>Capi-Aprende</h1>
    <p>Protótipo clicável do sistema — escolha qual parte quer abrir.</p>
    <div class="links">
      <a class="btn primary" href="app/login.html">Abrir app do aluno</a>
      <a class="btn ghost" href="adm/login-professor.html">Abrir área do professor</a>
    </div>
  </div>
</body>
</html>
