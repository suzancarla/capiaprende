# Monta a plataforma (npm run build) e deixa o site pronto para baixar.
# Use quando a plataforma fica DENTRO de um site que você já tem
# (ex.: https://capiaprende.capibots.com.br/plataforma/).
# Como usar: aba Actions > "Montar o site da plataforma" > execução mais recente >
# no fim da página, em "Artifacts", baixe "site-plataforma". Extraia o zip e
# coloque o CONTEÚDO (index.html e a pasta assets) na pasta "plataforma" do seu site.
name: Montar o site da plataforma

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  montar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site-plataforma
          path: dist
          if-no-files-found: error
          retention-days: 30